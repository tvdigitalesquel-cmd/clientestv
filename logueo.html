<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>TV Digital | Acceso al panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card: #080808;
            --card-2: #101010;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(79,140,255,0.45);
            --text: #ffffff;
            --muted: #9ca3af;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #f87171;
            --danger-soft: rgba(248,113,113,0.12);
            --radius-xl: 28px;
            --radius-lg: 18px;
            --radius-md: 14px;
            --shadow: 0 24px 70px rgba(0,0,0,0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { color-scheme: dark; }
        body {
            min-height: 100vh;
            font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000;
            color: var(--text);
        }

        button, input { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #000;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background:
                linear-gradient(180deg, rgba(15,15,18,0.98), rgba(5,5,7,0.99));
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: var(--radius-xl);
            box-shadow: 0 30px 90px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.04);
            padding: 38px 30px 28px;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at top center, rgba(59,130,246,0.18), transparent 38%);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-logo {
            width: min(100%, 230px);
            display: block;
            margin-bottom: 22px;
            filter: drop-shadow(0 0 22px rgba(59,130,246,0.22));
        }

        .brand-title {
            font-size: clamp(26px, 4vw, 32px);
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1.03;
            max-width: 290px;
            margin: 0 auto;
            text-wrap: balance;
        }

        .brand-subtitle {
            margin-top: 12px;
            color: #9aa3b2;
            font-size: 13px;
            line-height: 1.6;
            max-width: 300px;
        }

        .form-login { margin-top: 22px; }
        .field { margin-bottom: 16px; }
        .field-label {
            display: block;
            margin-bottom: 8px;
            color: #d1d5db;
            font-size: 12px;
            font-weight: 600;
        }

        .input-control { position: relative; }
        .input-style {
            width: 100%;
            height: 54px;
            padding: 0 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #121212, #0d0d0d);
            color: var(--text);
            outline: none;
            transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
            font-size: 16px;
        }

        .input-style::placeholder { color: #6b7280; }
        .input-style:focus {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 4px rgba(59,130,246,0.12);
            background: #161616;
        }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--muted);
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            cursor: pointer;
        }

        .password-toggle:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .password-toggle svg { width: 18px; height: 18px; }

        .submit-button {
            width: 100%;
            height: 54px;
            margin-top: 6px;
            border: 0;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, #4f8cff, #2563eb);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
            box-shadow: 0 16px 34px rgba(37,99,235,0.28);
        }

        .submit-button:hover { filter: brightness(1.05); transform: translateY(-1px); }
        .submit-button:active { transform: translateY(0); }
        .submit-button.loading { pointer-events: none; opacity: .85; }

        .spinner {
            display: inline-block;
            width: 17px;
            height: 17px;
            margin-right: 8px;
            vertical-align: middle;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .error-message {
            display: none;
            margin-top: 14px;
            padding: 13px 14px;
            color: #fecaca;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            border: 1px solid rgba(248, 113, 113, 0.22);
            border-radius: 12px;
            background: var(--danger-soft);
        }

        .error-message.show { display: block; }

        .footer-note {
            margin-top: 18px;
            text-align: center;
            color: #6b7280;
            font-size: 11px;
        }

        @media (max-width: 640px) {
            .page { padding: 14px; align-items: center; }
            .login-card { padding: 26px 18px 22px; border-radius: 22px; }
            .brand-logo { width: min(100%, 210px); margin-bottom: 18px; }
            .brand-title { font-size: 24px; max-width: 250px; }
            .brand-subtitle { font-size: 13px; }
        }
    </style>
</head>

                mostrarError('Completá el usuario y la contraseña.');
                return;
            }

            activarCarga();

            try {
                const { data, error } = await supabaseClient
                    .from('usuarios_sistema')
                    .select('*')
                    .eq('username', username)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    mostrarError('Usuario o contraseña incorrectos.');
                    return;
                }

                if (data.activo === false) {
                    mostrarError('Tu acceso se encuentra deshabilitado. Contactá al administrador.');
                    return;
                }

                const hoy = new Date();
                const vencimiento = data.vencimiento_acceso
                    ? new Date(data.vencimiento_acceso + 'T23:59:59')
                    : null;

                if (vencimiento && vencimiento < hoy) {
                    mostrarError('Tu acceso está vencido. Contactá al administrador.');
                    return;
                }

                localStorage.setItem('session_tvdigital', JSON.stringify(data));
                btnText.textContent = 'Acceso concedido';
                submitBtn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';

                window.setTimeout(() => {
                    window.location.href = 'index.html';
                }, 550);

            } catch (error) {
                console.error(error);
                mostrarError('No se pudo conectar con el sistema. Intentá nuevamente.');
            } finally {
                if (!localStorage.getItem('session_tvdigital')) {
                    desactivarCarga();
                }
            }
        });

        function activarCarga() {
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner" aria-hidden="true"></span>Verificando acceso';
            errorMsg.classList.remove('show');
            errorMsg.textContent = '';
        }

        function desactivarCarga() {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            btnText.textContent = 'Ingresar al panel';
            submitBtn.style.background = '';
        }

        function mostrarError(mensaje) {
            errorMsg.textContent = '⚠ ' + mensaje;
            errorMsg.classList.add('show');
            desactivarCarga();
            userInput.focus();
        }

        window.addEventListener('load', () => {
            userInput.focus();
        });
    </script>
</body>
</html>
